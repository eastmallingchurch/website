<title>Site Under Construction</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap');

  :root {
    --bg: #faf6ee;
    --surface: #ffffff;
    --text: #2c2620;
    --text-muted: #746a58;
    --accent: #ab8654;
    --accent-soft: #e7dac2;
    --border: #e6dcc6;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1712;
      --surface: #221d17;
      --text: #f1e9d8;
      --text-muted: #ab9f8a;
      --accent: #d3ab72;
      --accent-soft: #3a3122;
      --border: #3a3122;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1b1712;
    --surface: #221d17;
    --text: #f1e9d8;
    --text-muted: #ab9f8a;
    --accent: #d3ab72;
    --accent-soft: #3a3122;
    --border: #3a3122;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px 4px 120px 120px / 4px 4px 90px 90px;
    padding: 56px 36px 48px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .mark {
    width: 34px;
    height: 34px;
    position: relative;
    flex-shrink: 0;
    margin-bottom: 4px;
  }
  .mark::before,
  .mark::after {
    content: "";
    position: absolute;
    background: var(--accent);
    border-radius: 1px;
  }
  .mark::before {
    left: 50%;
    top: 0;
    width: 4px;
    height: 34px;
    transform: translateX(-50%);
  }
  .mark::after {
    top: 34%;
    left: 0;
    width: 34px;
    height: 4px;
  }

  h1 {
    font-family: "Fraunces", ui-serif, Georgia, serif;
    font-weight: 500;
    font-size: clamp(1.7rem, 5vw, 2.1rem);
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0;
  }

  p.body {
    margin: 0;
    max-width: 34ch;
    color: var(--text-muted);
    font-size: 1rem;
    line-height: 1.6;
  }

  .divider {
    width: 48px;
    height: 1px;
    background: var(--accent-soft);
    border: none;
    margin: 4px 0;
  }

  .footnote {
    margin: 0;
    font-size: 0.82rem;
    color: var(--text-muted);
    font-style: italic;
    font-family: "Fraunces", ui-serif, Georgia, serif;
  }
</style>

<div class="card">
  <div class="mark" aria-hidden="true"></div>
  <p class="eyebrow">Under Construction</p>
  <h1>Our new website is on its way</h1>
  <p class="body">
    We're building a home online to match the welcome you'll find in person.
    Please check back soon.
  </p>
  <hr class="divider" />
  <p class="footnote">Thank you for your patience</p>
</div>
